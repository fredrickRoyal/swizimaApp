# =====================================================================
# Swizima APIs Stack (All 6 Spring Boot APIs pulled from Docker Hub)
# Connects to the existing PostgreSQL stack on `swizima-network`.
#
#   docker compose pull            # pull latest images from Docker Hub
#   docker compose up -d           # start all 6 APIs
#   docker compose ps              # status
#   docker compose logs -f         # tail logs
#   docker compose down            # stop API containers
# =====================================================================
name: swizima-apis

services:
  # -------------------------------------------------------------------
  # Users API (8085)
  # -------------------------------------------------------------------
  usersapi:
    image: fredrickkasoma/swizima-usersapi:${TAG:-latest}
    pull_policy: always
    container_name: swizima-usersapi
    restart: unless-stopped
    environment:
      SERVER_PORT: 8085
      DB_URL: jdbc:postgresql://${DB_HOST:-swizima-postgres}:${DB_PORT:-5432}/swizima_users
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      MAIL_USERNAME: ${MAIL_USERNAME:-swizimaapp@gmail.com}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-oxid ejkk unfp cgfq}
      WHATSAPP_ENABLED: ${WHATSAPP_ENABLED:-true}
      OTP_WHATSAPP_ENABLED: ${OTP_WHATSAPP_ENABLED:-true}
      WHATSAPP_PROVIDER: ${WHATSAPP_PROVIDER:-CUSTOM}
      WHATSAPP_SERVICE_URL: ${WHATSAPP_SERVICE_URL:-http://165.245.157.109:8088}
      WHATSAPP_SERVICE_API_KEY: ${WHATSAPP_SERVICE_API_KEY:-swz-wa-relay-2026-secret}
      WHATSAPP_META_API_VERSION: ${WHATSAPP_META_API_VERSION:-v25.0}
      WHATSAPP_META_PHONE_NUMBER_ID: ${WHATSAPP_META_PHONE_NUMBER_ID:-1503783962810442}
      WHATSAPP_META_ACCESS_TOKEN: ${WHATSAPP_META_ACCESS_TOKEN:-EAGfZBqpmU6u8BTOiKm2l7BVpryc9rPUKwYgJfWjGW4GDe2ZCHCYlX3TO3nx6FhcVNEyNXg1P4u4IebFbXK0pjOVWwG29EjrSibBGLJnkG4ZCZBIZC7im9OecYHNajvdeNboBkCoSZBZCmMxZCwumbzAyGWqEyB2dO4yxAr9LRmWNQv26jNjxE53o9PUFMTjUAr3bQAZDZD}
      WHATSAPP_META_DEFAULT_TEMPLATE: ${WHATSAPP_META_DEFAULT_TEMPLATE:-3p_direct_integration_test_template}
      WHATSAPP_META_DEFAULT_LANG: ${WHATSAPP_META_DEFAULT_LANG:-en_US}
    ports:
      - "8085:8085"
    networks:
      - swizima

  # -------------------------------------------------------------------
  # Client API (8081)
  # -------------------------------------------------------------------
  clientapi:
    image: fredrickkasoma/swizima-clientapi:${TAG:-latest}
    pull_policy: always
    container_name: swizima-clientapi
    restart: unless-stopped
    environment:
      SERVER_PORT: 8081
      DB_URL: jdbc:postgresql://${DB_HOST:-swizima-postgres}:${DB_PORT:-5432}/swizima_client
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      USERS_API_URL: http://usersapi:8085
    ports:
      - "8081:8081"
    networks:
      - swizima

  # -------------------------------------------------------------------
  # Configurations API (8082)
  # -------------------------------------------------------------------
  configurationsapi:
    image: fredrickkasoma/swizima-configurationsapi:${TAG:-latest}
    pull_policy: always
    container_name: swizima-configurationsapi
    restart: unless-stopped
    environment:
      SERVER_PORT: 8082
      DB_URL: jdbc:postgresql://${DB_HOST:-swizima-postgres}:${DB_PORT:-5432}/swizima_configurations
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "8082:8082"
    networks:
      - swizima

  # -------------------------------------------------------------------
  # Payments API (8083)
  # -------------------------------------------------------------------
  paymentsapi:
    image: fredrickkasoma/swizima-paymentsapi:${TAG:-latest}
    pull_policy: always
    container_name: swizima-paymentsapi
    restart: unless-stopped
    depends_on:
      - configurationsapi
    environment:
      SERVER_PORT: 8083
      DB_URL: jdbc:postgresql://${DB_HOST:-swizima-postgres}:${DB_PORT:-5432}/swizima_payments
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      CONFIGURATIONS_API_URL: http://configurationsapi:8082
    ports:
      - "8083:8083"
    networks:
      - swizima

  # -------------------------------------------------------------------
  # Client Transactions API (8084)
  # -------------------------------------------------------------------
  clienttransactionsapi:
    image: fredrickkasoma/swizima-clienttransactionsapi:${TAG:-latest}
    pull_policy: always
    container_name: swizima-clienttransactionsapi
    restart: unless-stopped
    depends_on:
      - paymentsapi
    environment:
      SERVER_PORT: 8084
      DB_URL: jdbc:postgresql://${DB_HOST:-swizima-postgres}:${DB_PORT:-5432}/swizima_client_transactions
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      PAYMENTS_API_URL: http://paymentsapi:8083
    ports:
      - "8084:8084"
    networks:
      - swizima

  # -------------------------------------------------------------------
  # StaffTrack API (8086)
  # -------------------------------------------------------------------
  stafftrackapi:
    image: fredrickkasoma/swizima-stafftrackapi:${TAG:-latest}
    pull_policy: always
    container_name: swizima-stafftrackapi
    restart: unless-stopped
    environment:
      SERVER_PORT: 8086
      DB_URL: jdbc:postgresql://${DB_HOST:-swizima-postgres}:${DB_PORT:-5432}/swizima_stafftrack
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      USERS_API_URL: http://usersapi:8085
      MAIL_USERNAME: ${MAIL_USERNAME:-swizimaapp@gmail.com}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-mmxh tnco jgml keyl}
      PORTAL_BASE_URL: ${PORTAL_BASE_URL:-http://154.72.196.32:5000}
      WHATSAPP_ENABLED: ${WHATSAPP_ENABLED:-true}
      WHATSAPP_SERVICE_URL: ${WHATSAPP_SERVICE_URL:-http://165.245.157.109:8088}
      WHATSAPP_SERVICE_API_KEY: ${WHATSAPP_SERVICE_API_KEY:-swz-wa-relay-2026-secret}
      WHATSAPP_META_DIRECT_FALLBACK: ${WHATSAPP_META_DIRECT_FALLBACK:-false}
      WHATSAPP_META_API_VERSION: ${WHATSAPP_META_API_VERSION:-v25.0}
      WHATSAPP_META_PHONE_NUMBER_ID: ${WHATSAPP_META_PHONE_NUMBER_ID:-1503783962810442}
      WHATSAPP_META_ACCESS_TOKEN: ${WHATSAPP_META_ACCESS_TOKEN:-EAGfZBqpmU6u8BTOiKm2l7BVpryc9rPUKwYgJfWjGW4GDe2ZCHCYlX3TO3nx6FhcVNEyNXg1P4u4IebFbXK0pjOVWwG29EjrSibBGLJnkG4ZCZBIZC7im9OecYHNajvdeNboBkCoSZBZCmMxZCwumbzAyGWqEyB2dO4yxAr9LRmWNQv26jNjxE53o9PUFMTjUAr3bQAZDZD}
      WHATSAPP_META_DEFAULT_TEMPLATE: ${WHATSAPP_META_DEFAULT_TEMPLATE:-3p_direct_integration_test_template}
      WHATSAPP_META_DEFAULT_LANG: ${WHATSAPP_META_DEFAULT_LANG:-en_US}
    ports:
      - "8086:8086"
    networks:
      - swizima

  # -------------------------------------------------------------------
  # Files API (8087)
  # -------------------------------------------------------------------
  filesapi:
    image: fredrickkasoma/swizima-filesapi:${TAG:-latest}
    pull_policy: always
    container_name: swizima-filesapi
    restart: unless-stopped
    environment:
      SERVER_PORT: 8087
      DB_URL: jdbc:postgresql://${DB_HOST:-swizima-postgres}:${DB_PORT:-5432}/swizima_files
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "8087:8087"
    networks:
      - swizima

  # -------------------------------------------------------------------
  # API Gateway (9080)
  # -------------------------------------------------------------------
  apigateway:
    image: fredrickkasoma/swizima-apigateway:${TAG:-latest}
    pull_policy: always
    container_name: swizima-apigateway
    restart: unless-stopped
    depends_on:
      - usersapi
      - clientapi
      - configurationsapi
      - paymentsapi
      - clienttransactionsapi
      - stafftrackapi
      - filesapi
    environment:
      SERVER_PORT: 9080
      CLIENT_API_URL: http://clientapi:8081
      CONFIGURATIONS_API_URL: http://configurationsapi:8082
      PAYMENTS_API_URL: http://paymentsapi:8083
      CLIENT_TRANSACTIONS_API_URL: http://clienttransactionsapi:8084
      USERS_API_URL: http://usersapi:8085
      STAFFTRACK_API_URL: http://stafftrackapi:8086
      FILES_API_URL: http://filesapi:8087
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
    ports:
      - "${GATEWAY_PORT:-9080}:9080"
    networks:
      - swizima

networks:
  swizima:
    name: swizima-network
    external: true
