<a routerLink="/welcome" class="brand" (click)="navigate.emit()" title="Go to Swizima home page">
  <span class="logo" aria-hidden="true">
    <img src="favicon.png" alt="" width="38" height="38" />
  </span>
  <span class="brand-text">
    <strong>Swizima</strong>
    <small>Explore your world for less</small>
  </span>
</a>

<nav class="nav" aria-label="Main">
  @for (group of groups(); track group.heading) {
    <p class="group-heading">{{ group.heading }}</p>
    <ul>
      @for (item of group.items; track item.path) {
        <li>
          <a [routerLink]="item.path" routerLinkActive="active" ariaCurrentWhenActive="page"
             class="nav-link" (click)="navigate.emit()">
            <app-icon [name]="item.icon" />
            <span>{{ item.label }}</span>
          </a>
        </li>
      }
    </ul>
  }
</nav>

<div class="sidebar-footer">
  <a
    [href]="mobileAppUrl"
    target="_blank"
    rel="noopener noreferrer"
    class="mobile-app-link"
    id="nav-download-mobile-app"
    (click)="navigate.emit()"
  >
    <span class="mobile-app-icon" aria-hidden="true">
      <app-icon name="sms" />
    </span>
    <span class="mobile-app-text">
      <strong>Mobile App</strong>
      <small>Download Android APK</small>
    </span>
    <app-icon name="download" class="mobile-app-dl" />
  </a>

  <div class="user">
    <span class="avatar" aria-hidden="true">{{ initials() }}</span>
    <span class="user-text">
      <strong>{{ username() || 'Signed in' }}</strong>
      <small>{{ roleLabel() }}</small>
    </span>
    <button type="button" class="signout" (click)="signOut.emit()" aria-label="Sign out" title="Sign out">
      <app-icon name="logout" />
    </button>
  </div>
</div>
