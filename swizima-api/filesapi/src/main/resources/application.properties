spring.application.name=filesapi

# ===============================
# Server
# ===============================
server.port=${SERVER_PORT:8087}

# ===============================
# Database (PostgreSQL)
# Override via environment variables in non-local environments.
# ===============================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/swizima_files}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool (HikariCP)
spring.datasource.hikari.pool-name=FilesApiHikariPool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1800000

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ===============================
# Jackson
# ===============================
spring.jackson.default-property-inclusion=non_null
spring.jackson.time-zone=UTC

# ===============================
# File Storage & Multipart
# ===============================
file.storage.root-path=${ROOT_FOLDER_PATH:/tmp/swizima-files}
file.storage.max-file-size=${MAX_FILE_SIZE:500MB}
file.storage.allowed-extensions=${ALLOWED_FILE_EXTENSIONS:jpg,jpeg,png,gif,webp,svg,pdf,doc,docx,xls,xlsx,txt,csv,zip,rar}
file.storage.enable-virus-scan=false

spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:500MB}
spring.servlet.multipart.max-request-size=${MAX_FILE_SIZE:500MB}

# ===============================
# OpenAPI / Swagger
# ===============================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
