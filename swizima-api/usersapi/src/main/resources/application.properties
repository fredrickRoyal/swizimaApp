spring.application.name=usersapi

# ===============================
# Server
# ===============================
server.port=${SERVER_PORT:8085}

# ===============================
# Database (PostgreSQL)
# Override via environment variables in non-local environments.
# ===============================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/swizima_users}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool (HikariCP)
spring.datasource.hikari.pool-name=UsersApiHikariPool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1800000

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ===============================
# Jackson
# ===============================
spring.jackson.default-property-inclusion=non_null
spring.jackson.time-zone=UTC

# ===============================
# OpenAPI / Swagger
# ===============================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# ===============================
# Application settings
# ===============================
# Country calling code used to normalise local phone numbers (e.g. 0700123456 -> +256700123456)
app.users.default-country-code=${DEFAULT_COUNTRY_CODE:256}
# Length of system-generated temporary passwords
app.users.temp-password-length=12

# ===============================
# Email (SMTP)
# Defaults target Gmail. For Gmail use an App Password (not your account password):
# https://myaccount.google.com/apppasswords
# Set MAIL_USERNAME / MAIL_PASSWORD as environment variables - never commit real credentials.
# ===============================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:swizimaapp@gmail.com}
spring.mail.password=${MAIL_PASSWORD:mmxh tnco jgml keyl}
spring.mail.protocol=smtp
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# Sender identity shown to recipients
app.mail.from=${MAIL_FROM:no-reply@swizima.com}
app.mail.from-name=${MAIL_FROM_NAME:Swizima}

# Don't fail the actuator health check when SMTP is unreachable in local dev
management.health.mail.enabled=${MAIL_HEALTH_ENABLED:false}

# ===============================
# OTP (one-time passwords for login)
# ===============================
app.otp.length=6
app.otp.expiry-minutes=5
app.otp.max-attempts=5
app.otp.resend-cooldown-seconds=60
# EMAIL | SMS | WHATSAPP - used when neither the request nor the user specifies a channel
app.otp.default-channel=EMAIL
# Print OTP codes to the console - LOCAL DEVELOPMENT ONLY
app.otp.log-code=${OTP_LOG_CODE:false}
# Enable once a provider is integrated
app.otp.sms.enabled=${OTP_SMS_ENABLED:false}
app.otp.whatsapp.enabled=${OTP_WHATSAPP_ENABLED:false}

# ===============================
# WhatsApp Messaging Service & Provider Configurations
# Supported providers: META (WhatsApp Business Cloud API), TWILIO, CUSTOM
# ===============================
app.whatsapp.enabled=${WHATSAPP_ENABLED:false}
app.whatsapp.provider=${WHATSAPP_PROVIDER:META}
app.whatsapp.default-country-code=${DEFAULT_COUNTRY_CODE:256}
app.whatsapp.log-payload=${WHATSAPP_LOG_PAYLOAD:true}

# --- Meta WhatsApp Business Cloud API ---
app.whatsapp.meta.base-url=${WHATSAPP_META_BASE_URL:https://graph.facebook.com}
app.whatsapp.meta.api-version=${WHATSAPP_META_API_VERSION:v21.0}
app.whatsapp.meta.phone-number-id=${WHATSAPP_META_PHONE_NUMBER_ID:}
app.whatsapp.meta.business-account-id=${WHATSAPP_META_BUSINESS_ACCOUNT_ID:}
app.whatsapp.meta.access-token=${WHATSAPP_META_ACCESS_TOKEN:}
app.whatsapp.meta.default-template-name=${WHATSAPP_META_DEFAULT_TEMPLATE:}
app.whatsapp.meta.default-language-code=${WHATSAPP_META_DEFAULT_LANG:en_US}
app.whatsapp.meta.webhook-verify-token=${WHATSAPP_META_WEBHOOK_VERIFY_TOKEN:}

# --- Twilio WhatsApp API ---
app.whatsapp.twilio.base-url=${WHATSAPP_TWILIO_BASE_URL:https://api.twilio.com/2010-04-01}
app.whatsapp.twilio.account-sid=${WHATSAPP_TWILIO_ACCOUNT_SID:}
app.whatsapp.twilio.auth-token=${WHATSAPP_TWILIO_AUTH_TOKEN:}
app.whatsapp.twilio.from-number=${WHATSAPP_TWILIO_FROM_NUMBER:whatsapp:+14155238886}

# --- Custom HTTP WhatsApp Gateway ---
app.whatsapp.custom.endpoint-url=${WHATSAPP_CUSTOM_ENDPOINT_URL:}
app.whatsapp.custom.api-key=${WHATSAPP_CUSTOM_API_KEY:}
app.whatsapp.custom.auth-header-name=${WHATSAPP_CUSTOM_AUTH_HEADER:Authorization}

# ===============================
# Super admin seed (created on start-up if no SUPER_ADMIN exists)
# Override via environment variables and CHANGE THE PASSWORD after first login.
# ===============================
app.seed.super-admin.enabled=${SUPER_ADMIN_SEED_ENABLED:true}
app.seed.super-admin.email=${SUPER_ADMIN_EMAIL:kfredrick35@gmail.com}
app.seed.super-admin.phone-number=${SUPER_ADMIN_PHONE:+256700408387}
app.seed.super-admin.password=${SUPER_ADMIN_PASSWORD:123456}
# true = login response returns mustChangePassword=true until the password is changed
app.seed.super-admin.force-password-change=${SUPER_ADMIN_FORCE_PASSWORD_CHANGE:true}
