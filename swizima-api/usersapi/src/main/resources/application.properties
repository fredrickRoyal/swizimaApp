spring.application.name=usersapi

# ===============================
# Server
# ===============================
server.port=${SERVER_PORT:8085}

# ===============================
# Database (PostgreSQL)
# Override via environment variables in non-local environments.
# ===============================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/swizima_users}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool (HikariCP)
spring.datasource.hikari.pool-name=UsersApiHikariPool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1800000

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ===============================
# Jackson
# ===============================
spring.jackson.default-property-inclusion=non_null
spring.jackson.time-zone=UTC

# ===============================
# OpenAPI / Swagger
# ===============================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# ===============================
# Application settings
# ===============================
# Country calling code used to normalise local phone numbers (e.g. 0700123456 -> +256700123456)
app.users.default-country-code=${DEFAULT_COUNTRY_CODE:256}
# Length of system-generated temporary passwords
app.users.temp-password-length=12

# ===============================
# Email (SMTP)
# Defaults target Gmail. For Gmail use an App Password (not your account password):
# https://myaccount.google.com/apppasswords
# Set MAIL_USERNAME / MAIL_PASSWORD as environment variables - never commit real credentials.
# ===============================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:swizimaapp@gmail.com}
spring.mail.password=${MAIL_PASSWORD:oxid ejkk unfp cgfq}
spring.mail.protocol=smtp
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# Sender identity shown to recipients
app.mail.from=${MAIL_FROM:no-reply@swizima.com}
app.mail.from-name=${MAIL_FROM_NAME:Swizima}

# Don't fail the actuator health check when SMTP is unreachable in local dev
management.health.mail.enabled=${MAIL_HEALTH_ENABLED:false}

# ===============================
# OTP (one-time passwords for login)
# ===============================
app.otp.length=6
app.otp.expiry-minutes=5
app.otp.max-attempts=5
app.otp.resend-cooldown-seconds=60
# EMAIL | SMS | WHATSAPP - used when neither the request nor the user specifies a channel
app.otp.default-channel=EMAIL
# Print OTP codes to the console - LOCAL DEVELOPMENT ONLY
app.otp.log-code=${OTP_LOG_CODE:false}
# Enable once a provider is integrated
app.otp.sms.enabled=${OTP_SMS_ENABLED:false}
app.otp.whatsapp.enabled=${OTP_WHATSAPP_ENABLED:false}

# ===============================
# Super admin seed (created on start-up if no SUPER_ADMIN exists)
# Override via environment variables and CHANGE THE PASSWORD after first login.
# ===============================
app.seed.super-admin.enabled=${SUPER_ADMIN_SEED_ENABLED:true}
app.seed.super-admin.email=${SUPER_ADMIN_EMAIL:kfredrick35@gmail.com}
app.seed.super-admin.phone-number=${SUPER_ADMIN_PHONE:+256700408387}
app.seed.super-admin.password=${SUPER_ADMIN_PASSWORD:123456}
# true = login response returns mustChangePassword=true until the password is changed
app.seed.super-admin.force-password-change=${SUPER_ADMIN_FORCE_PASSWORD_CHANGE:true}
