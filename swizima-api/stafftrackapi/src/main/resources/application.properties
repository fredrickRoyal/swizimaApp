spring.application.name=stafftrackapi

# ===============================
# Server
# ===============================
server.port=${SERVER_PORT:8086}

# ===============================
# Database (PostgreSQL)
# Override via environment variables in non-local environments.
# createDatabaseIfNotExist=true ensures swizima_stafftrack is auto-created if PostgreSQL was initialized earlier
# ===============================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/swizima_stafftrack}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool (HikariCP) - keep retrying on startup instead of crashing the container if DB isn't ready yet
spring.datasource.hikari.pool-name=StaffTrackApiHikariPool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.initialization-fail-timeout=60000

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ===============================
# Jackson
# ===============================
spring.jackson.default-property-inclusion=non_null
spring.jackson.time-zone=UTC

# ===============================
# OpenAPI / Swagger
# ===============================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# ===============================
# Email (SMTP) & Supervisor Notifications
# ===============================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:swizimaapp@gmail.com}
spring.mail.password=${MAIL_PASSWORD:mmxh tnco jgml keyl}
spring.mail.protocol=smtp
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

app.mail.from=${MAIL_FROM:no-reply@swizima.com}
app.mail.from-name=${MAIL_FROM_NAME:Staff Out-of-Office notification}
management.health.mail.enabled=${MAIL_HEALTH_ENABLED:false}

