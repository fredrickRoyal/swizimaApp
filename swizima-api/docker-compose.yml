# =====================================================================
# Swizima API - local infrastructure
#
#   docker compose up -d        # start
#   docker compose ps           # status / health
#   docker compose logs -f postgres
#   docker compose down         # stop (data is kept in POSTGRES_DATA_DIR on the host)
#   docker compose down -v      # stop and remove the volume definition - host files are KEPT;
#                               # to reset the DB, also empty POSTGRES_DATA_DIR (sudo rm -rf <dir>/*)
#
# Values can be overridden in a .env file next to this file (see .env.example).
# =====================================================================
name: swizima

services:
  # -------------------------------------------------------------------
  # PostgreSQL 18.6 (latest stable) - one database per service
  # -------------------------------------------------------------------
  postgres:
    image: postgres:18.6
    container_name: swizima-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      # Created on first start by docker/postgres/init/01-create-databases.sh
      POSTGRES_MULTIPLE_DATABASES: ${POSTGRES_MULTIPLE_DATABASES:-swizima_users,swizima_client,swizima_configurations,swizima_payments,swizima_service}
      TZ: UTC
      PGTZ: UTC
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18+ images keep data under /var/lib/postgresql/<major>/docker,
      # so the volume is mounted at /var/lib/postgresql (not .../data).
      # Files end up on the host in POSTGRES_DATA_DIR (see volumes section below).
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - swizima

volumes:
  # Named volume backed by a host directory, so the database files live outside Docker
  # and survive `docker compose down -v`. The directory must exist before starting.
  postgres-data:
    name: swizima-postgres-data
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${POSTGRES_DATA_DIR:-/home/kasoma/swizima/Projects/Swizima/dbdata}

networks:
  swizima:
    name: swizima-network
