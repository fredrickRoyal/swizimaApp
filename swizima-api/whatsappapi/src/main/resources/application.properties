spring.application.name=whatsappapi
# Supports both DigitalOcean App Platform (PORT) and Docker / Droplet (SERVER_PORT)
server.port=${PORT:${SERVER_PORT:8088}}

# ===============================
# Actuator & OpenAPI
# ===============================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ===============================
# Relay Security (Uganda Backend -> DigitalOcean Relay)
# Pass via header `X-API-Key: <key>` or `Authorization: Bearer <key>`
# ===============================
app.whatsapp.auth-required=${WHATSAPP_AUTH_REQUIRED:true}
app.whatsapp.service-api-key=${WHATSAPP_SERVICE_API_KEY:swz-wa-relay-2026-secret}
app.whatsapp.enabled=${WHATSAPP_ENABLED:true}
app.whatsapp.default-country-code=${DEFAULT_COUNTRY_CODE:256}
app.whatsapp.default-test-recipient=${WHATSAPP_TEST_RECIPIENT:256700408387}
app.whatsapp.log-payload=${WHATSAPP_LOG_PAYLOAD:true}

# ===============================
# Meta WhatsApp Business Cloud API (Direct from DigitalOcean -> graph.facebook.com)
# ===============================
app.whatsapp.meta.base-url=${WHATSAPP_META_BASE_URL:https://graph.facebook.com}
app.whatsapp.meta.api-version=${WHATSAPP_META_API_VERSION:v25.0}
app.whatsapp.meta.phone-number-id=${WHATSAPP_META_PHONE_NUMBER_ID:1503783962810442}
app.whatsapp.meta.business-account-id=${WHATSAPP_META_BUSINESS_ACCOUNT_ID:}
