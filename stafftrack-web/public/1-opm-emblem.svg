<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- Outer Official Gold & Navy Ring -->
  <circle cx="60" cy="60" r="57" fill="#0B2447" stroke="#D97706" stroke-width="4"/>
  <circle cx="60" cy="60" r="49" fill="#FFFFFF" stroke="#005EB8" stroke-width="1.5"/>

  <!-- Uganda National Colors Ribbon Arch -->
  <path d="M22 86 C35 98, 85 98, 98 86" stroke="#111827" stroke-width="4" stroke-linecap="round"/>
  <path d="M25 90 C38 101, 82 101, 95 90" stroke="#FACC15" stroke-width="4" stroke-linecap="round"/>
  <path d="M28 94 C41 104, 79 104, 92 94" stroke="#DC2626" stroke-width="4" stroke-linecap="round"/>

  <!-- Sunburst Rays above Shield -->
  <circle cx="60" cy="31" r="7" fill="#F59E0B"/>
  <path d="M60 19v4M50 23l2.5 2.5M70 23l-2.5 2.5M46 31h4M70 31h4" stroke="#D97706" stroke-width="2" stroke-linecap="round"/>

  <!-- Crossed Spears behind Shield -->
  <line x1="36" y1="78" x2="84" y2="28" stroke="#92400E" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="84" y1="78" x2="36" y2="28" stroke="#92400E" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Central Ugandan Shield -->
  <path d="M60 36 C46 36, 42 47, 42 57 C42 69, 51 78, 60 83 C69 78, 78 69, 78 57 C78 47, 74 36, 60 36 Z" fill="#1E3A8A" stroke="#D97706" stroke-width="2.5"/>

  <!-- Waves of Lake Victoria at Top of Shield -->
  <path d="M46 47 Q53 44, 60 47 T74 47" stroke="#38BDF8" stroke-width="2" fill="none"/>
  <path d="M45 52 Q53 49, 60 52 T75 52" stroke="#FFFFFF" stroke-width="2" fill="none"/>

  <!-- Crested Crane / Protection Hands Motif in Center -->
  <circle cx="60" cy="63" r="8" fill="#FACC15"/>
  <path d="M55 64 L59 59 L65 65" stroke="#111827" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M53 71 C57 68, 63 68, 67 71" stroke="#DC2626" stroke-width="2.2" stroke-linecap="round"/>

  <!-- OPM Text Banner -->
  <rect x="33" y="80" width="54" height="13" rx="3" fill="#005EB8" stroke="#D97706" stroke-width="1.2"/>
  <text x="60" y="89.5" text-anchor="middle" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="8" font-weight="800" letter-spacing="1">OPM · DOR</text>
</svg>

