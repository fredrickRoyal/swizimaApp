<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Staff Out-of-Office Tracker</title>
  <meta name="description" content="Staff Out-of-Office Tracker: A simple platform for tracking staff movements, official duties, activity reports and management actions.">
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" type="image/svg+xml" href="opm-emblem.svg">
  <link rel="icon" type="image/png" sizes="256x256" href="favicon.png">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('stafftrack.theme');
        var theme = saved === 'light' || saved === 'dark'
          ? saved
          : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
        document.documentElement.style.colorScheme = theme;
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
